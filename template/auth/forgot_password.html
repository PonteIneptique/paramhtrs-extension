{% extends "base.html" %}

{% block content %}
    <div class="container">
        <h2 class="my-4">Forgot your password?</h2>
        <form method="POST">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>
            <button type="submit" class="btn btn-primary">Send reset link</button>
        </form>
        <p class="mt-3"><a href="{{ url_for('bp_auth.login') }}">Back to login</a></p>
    </div>
{% endblock %}
